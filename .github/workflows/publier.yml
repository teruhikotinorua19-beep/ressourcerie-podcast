# Fabrique et publie le podcast sur GitHub Pages.
# La routine Claude pousse travail/selection.json et travail/script.txt, soit
# sur main, soit sur une branche claude/… (fusionnée d'abord dans main, où vit
# la mémoire etat/vus.json). Si un script est en attente, on fabrique ici
# l'épisode : la voix Microsoft n'est pas joignable depuis le cloud de Claude.
name: Publier le podcast
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publier
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Fusionner la branche claude/… dans main
        if: startsWith(github.ref_name, 'claude/')
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin "${{ github.ref_name }}"
          git merge --no-edit "origin/${{ github.ref_name }}"
          git push origin main
          git push origin --delete "${{ github.ref_name }}"
      - name: Script en attente ?
        id: attente
        run: test -f travail/script.txt && echo "oui=1" >> "$GITHUB_OUTPUT" || true
      - uses: actions/setup-python@v5
        if: steps.attente.outputs.oui
        with:
          python-version: "3.12"
      - name: Fabriquer l'épisode
        if: steps.attente.outputs.oui
        run: |
          pip install -q -r requirements.txt
          python episode.py
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A docs etat travail
          git commit -m "Épisode du $(TZ=Pacific/Tahiti date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploiement
        uses: actions/deploy-pages@v4
